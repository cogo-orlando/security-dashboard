# ══════════════════════════════════════════
#  DOCKER COMPOSE — Développement
#  Usage : docker compose -f docker-compose.dev.yml up
# ══════════════════════════════════════════
services:

  security-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: security-dashboard:dev
    container_name: security-dashboard-dev
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      TZ: "Europe/Paris"
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ENV: "development"
    volumes:
      - .:/app
      - /app/tmp